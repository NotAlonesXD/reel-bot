name: Daily Reel

on:
  schedule:
    - cron: "0 13 * * *"   # every day at 13:00 UTC - change the hour if you like
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: make the video but do NOT post (true/false)"
        default: "true"

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Make the video
        run: python main.py make
      - name: Save test video (dry run only)
        if: env.DRY_RUN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: videos/*.mp4
      - name: Commit video so Instagram can fetch it
        if: env.DRY_RUN == '0'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add videos history.json
          git commit -m "new reel"
          git push
      - name: Post to Instagram
        if: env.DRY_RUN == '0'
        run: python main.py post
      - name: Delete video from repo
        if: env.DRY_RUN == '0'
        run: |
          git rm -q videos/*.mp4
          git commit -m "cleanup"
          git push
